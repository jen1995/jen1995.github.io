baseURL = "https://jen1995.github.io/"
locale = "en-US"
title = "Cohomology Zero"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

pagination.pagerSize = 10

[params]
  author = "Eugenia Elistratova"
  description = "Cohomology Zero — a blog where we nerd out about machine learning and mathematics: transformers, generative models and much more."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  math = true

  [params.homeInfoParams]
    Title = "Cohomology Zero 👋"
    Content = "Hi, I'm Eugenia Elistratova. Here we unapologetically nerd out about machine learning and mathematics — transformers, generative models, and math for its own sake. The name is a nod to [this meme](https://youtu.be/mqAf5lOJZew): we're still waiting for the environment to answer — cohomology: zero?.. Find me on Telegram: [@evg3307](https://t.me/evg3307) or by email: [evg3307@yandex.ru](mailto:evg3307@yandex.ru)."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jen1995"
  [[params.socialIcons]]
    name = "telegram"
    url = "https://t.me/evg3307"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:evg3307@yandex.ru"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
