<text x="95" y="510" font-size="19" fill="#0b0b0b" font-weight="600">one normalization = one row:</text>
<text x="95" y="536" font-size="18" fill="#52514e">the d coordinates of a single token.</text>
<text x="95" y="560" font-size="18" fill="#52514e">b·n independent normalizations,</text>
<text x="95" y="584" font-size="18" fill="#52514e">d summands in each — no interaction</text>
<text x="95" y="608" font-size="18" fill="#52514e">between tokens, batch size irrelevant</text>
<text x="695" y="510" font-size="19" fill="#0b0b0b" font-weight="600">one normalization = one column:</text>
<text x="695" y="536" font-size="18" fill="#52514e">coordinate j, pooled over all tokens</text>
<text x="695" y="560" font-size="18" fill="#52514e">of all examples. d normalizations,</text>
<text x="695" y="584" font-size="18" fill="#52514e">b·n summands in each — every token</text>
<text x="695" y="608" font-size="18" fill="#52514e">depends on its batch neighbors</text>
