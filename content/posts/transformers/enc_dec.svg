<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8983"/>
    </marker>
  </defs>

  <!-- surface card -->
  <rect x="0" y="0" width="1200" height="640" rx="16" fill="#fcfcfb"/>

  <!-- ======== ENCODER ======== -->
  <rect x="120" y="260" width="300" height="120" rx="14" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="270" y="330" text-anchor="middle" font-size="34" font-weight="600" fill="#0b0b0b">Encoder</text>

  <!-- source tokens -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="21">
    <rect x="96"  y="480" width="42"  height="40" rx="8" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="117" y="507" text-anchor="middle" fill="#0b0b0b">Я</text>
    <rect x="146" y="480" width="84"  height="40" rx="8" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="188" y="507" text-anchor="middle" fill="#0b0b0b">видел</text>
    <rect x="238" y="480" width="70"  height="40" rx="8" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="273" y="507" text-anchor="middle" fill="#0b0b0b">кота</text>
    <rect x="316" y="480" width="42"  height="40" rx="8" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="337" y="507" text-anchor="middle" fill="#0b0b0b">на</text>
    <rect x="366" y="480" width="70"  height="40" rx="8" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="401" y="507" text-anchor="middle" fill="#0b0b0b">мате</text>
    <rect x="444" y="480" width="84"  height="40" rx="8" fill="none" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="486" y="507" text-anchor="middle" fill="#52514e">&lt;eos&gt;</text>
  </g>
  <text x="312" y="560" text-anchor="middle" font-size="20" fill="#52514e" font-style="italic">"I"&#160;&#160;"saw"&#160;&#160;"cat"&#160;&#160;"on"&#160;&#160;"mat"</text>
  <text x="312" y="600" text-anchor="middle" font-size="22" fill="#2a78d6" font-weight="600">source sentence</text>

  <!-- source -> encoder -->
  <line x1="312" y1="470" x2="290" y2="392" stroke="#8a8983" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ======== representation pill ======== -->
  <line x1="430" y1="320" x2="545" y2="320" stroke="#8a8983" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="556" y="284" width="48" height="72" rx="12" fill="#f1f0ee" stroke="#52514e" stroke-width="2"/>
  <circle cx="580" cy="304" r="6" fill="#2a78d6"/>
  <circle cx="580" cy="322" r="6" fill="#2a78d6"/>
  <circle cx="580" cy="340" r="6" fill="#2a78d6"/>
  <line x1="614" y1="320" x2="729" y2="320" stroke="#8a8983" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- annotation: representation -->
  <text x="580" y="240" text-anchor="middle" font-size="21" fill="#52514e">a single vector:</text>
  <text x="580" y="266" text-anchor="middle" font-size="21" fill="#52514e">the meaning of the source</text>

  <!-- ======== DECODER ======== -->
  <rect x="740" y="260" width="300" height="120" rx="14" fill="#fdefe9" stroke="#eb6834" stroke-width="2.5"/>
  <text x="890" y="330" text-anchor="middle" font-size="34" font-weight="600" fill="#0b0b0b">Decoder</text>

  <!-- decoder -> target -->
  <line x1="890" y1="250" x2="890" y2="172" stroke="#8a8983" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- target tokens -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="21">
    <rect x="646" y="90" width="34" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="663" y="117" text-anchor="middle" fill="#0b0b0b">I</text>
    <rect x="688" y="90" width="56" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="716" y="117" text-anchor="middle" fill="#0b0b0b">saw</text>
    <rect x="752" y="90" width="34" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="769" y="117" text-anchor="middle" fill="#0b0b0b">a</text>
    <rect x="794" y="90" width="56" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="822" y="117" text-anchor="middle" fill="#0b0b0b">cat</text>
    <rect x="858" y="90" width="44" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="880" y="117" text-anchor="middle" fill="#0b0b0b">on</text>
    <rect x="910" y="90" width="34" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="927" y="117" text-anchor="middle" fill="#0b0b0b">a</text>
    <rect x="952" y="90" width="56" height="40" rx="8" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="980" y="117" text-anchor="middle" fill="#0b0b0b">mat</text>
    <rect x="1016" y="90" width="84" height="40" rx="8" fill="none" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1058" y="117" text-anchor="middle" fill="#52514e">&lt;eos&gt;</text>
  </g>
  <text x="873" y="62" text-anchor="middle" font-size="22" fill="#eb6834" font-weight="600">target sentence</text>

  <!-- ======== annotations ======== -->
  <text x="270" y="180" text-anchor="middle" font-size="21" fill="#52514e">reads the source and packs it</text>
  <text x="270" y="206" text-anchor="middle" font-size="21" fill="#52514e">into an internal representation</text>
  <line x1="270" y1="218" x2="270" y2="248" stroke="#c9c8c2" stroke-width="1.5"/>

  <text x="890" y="452" text-anchor="middle" font-size="21" fill="#52514e">unpacks that representation</text>
  <text x="890" y="478" text-anchor="middle" font-size="21" fill="#52514e">into the target, token by token</text>
  <line x1="890" y1="424" x2="890" y2="392" stroke="#c9c8c2" stroke-width="1.5"/>
</svg>
