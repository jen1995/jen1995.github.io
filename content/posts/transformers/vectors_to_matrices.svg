<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8983"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="660" rx="16" fill="#fcfcfb"/>

  <!-- ================= top-left: encoder states stack into S ================= -->
  <g>
    <!-- individual vectors -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="17" text-anchor="middle">
      <rect x="70"  y="80" width="26" height="76" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.8"/>
      <rect x="112" y="80" width="26" height="76" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.8"/>
      <rect x="154" y="80" width="26" height="76" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2.6"/>
      <rect x="196" y="80" width="26" height="76" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.8"/>
      <rect x="238" y="80" width="26" height="76" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="1.8"/>
      <text x="83"  y="182" fill="#2a78d6">s₁</text>
      <text x="125" y="182" fill="#2a78d6">s₂</text>
      <text x="167" y="182" fill="#2a78d6" font-weight="700">s₃</text>
      <text x="209" y="182" fill="#2a78d6">s₄</text>
      <text x="251" y="182" fill="#2a78d6">s₅</text>
    </g>
    <text x="167" y="52" text-anchor="middle" font-size="19" fill="#52514e">m encoder states, each of dim d</text>

    <line x1="290" y1="118" x2="350" y2="118" stroke="#8a8983" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="320" y="98" text-anchor="middle" font-size="18" fill="#52514e">stack</text>

    <!-- matrix S: 5 rows (m) x 6 cols (d) -->
    <g>
      <rect x="370" y="60" width="222" height="152" rx="10" fill="none" stroke="#2a78d6" stroke-width="2"/>
      <!-- rows -->
      <g fill="#eaf2fb">
        <rect x="378" y="68"  width="206" height="22" rx="4"/>
        <rect x="378" y="96"  width="206" height="22" rx="4"/>
        <rect x="378" y="124" width="206" height="22" rx="4" fill="#d5e6f9"/>
        <rect x="378" y="152" width="206" height="22" rx="4"/>
        <rect x="378" y="180" width="206" height="22" rx="4"/>
      </g>
      <text x="481" y="140" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#2a78d6">← s₃ is row 3</text>
    </g>
    <text x="481" y="242" text-anchor="middle" font-size="19" fill="#0b0b0b"><tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#2a78d6">S</tspan> — m × d, one row per token</text>
  </g>

  <!-- ================= bottom-left: decoder states stack into H ================= -->
  <g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="17" text-anchor="middle">
      <rect x="91"  y="330" width="26" height="76" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="1.8"/>
      <rect x="133" y="330" width="26" height="76" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="1.8"/>
      <rect x="175" y="330" width="26" height="76" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="1.8"/>
      <rect x="217" y="330" width="26" height="76" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="1.8"/>
      <text x="104" y="432" fill="#eb6834">h₁</text>
      <text x="146" y="432" fill="#eb6834">h₂</text>
      <text x="188" y="432" fill="#eb6834">h₃</text>
      <text x="230" y="432" fill="#eb6834">h₄</text>
    </g>
    <text x="167" y="302" text-anchor="middle" font-size="19" fill="#52514e">n decoder states, each of dim d</text>

    <line x1="290" y1="368" x2="350" y2="368" stroke="#8a8983" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="320" y="348" text-anchor="middle" font-size="18" fill="#52514e">stack</text>

    <!-- matrix H: 4 rows (n) x 6 cols (d) -->
    <g>
      <rect x="370" y="310" width="222" height="124" rx="10" fill="none" stroke="#eb6834" stroke-width="2"/>
      <g fill="#fdefe9">
        <rect x="378" y="318" width="206" height="22" rx="4"/>
        <rect x="378" y="346" width="206" height="22" rx="4"/>
        <rect x="378" y="374" width="206" height="22" rx="4"/>
        <rect x="378" y="402" width="206" height="22" rx="4"/>
      </g>
    </g>
    <text x="481" y="464" text-anchor="middle" font-size="19" fill="#0b0b0b"><tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#eb6834">H</tspan> — n × d, one row per step</text>
  </g>

  <!-- ================= right: the product ================= -->
  <g font-family="ui-monospace, Menlo, monospace">
    <!-- H -->
    <rect x="700" y="220" width="120" height="88" rx="8" fill="none" stroke="#eb6834" stroke-width="2"/>
    <g fill="#fdefe9">
      <rect x="706" y="226" width="108" height="15" rx="3"/>
      <rect x="706" y="246" width="108" height="15" rx="3"/>
      <rect x="706" y="266" width="108" height="15" rx="3"/>
      <rect x="706" y="286" width="108" height="15" rx="3"/>
    </g>
    <text x="760" y="336" text-anchor="middle" font-size="19" fill="#eb6834" font-weight="700">H</text>

    <text x="850" y="272" text-anchor="middle" font-size="26" fill="#52514e" font-family="-apple-system, sans-serif">×</text>

    <!-- S^T: columns -->
    <rect x="880" y="200" width="128" height="128" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <g fill="#eaf2fb">
      <rect x="887" y="206" width="16" height="116" rx="3"/>
      <rect x="911" y="206" width="16" height="116" rx="3"/>
      <rect x="935" y="206" width="16" height="116" rx="3" fill="#d5e6f9"/>
      <rect x="959" y="206" width="16" height="116" rx="3"/>
      <rect x="983" y="206" width="16" height="116" rx="3"/>
    </g>
    <text x="944" y="356" text-anchor="middle" font-size="19" fill="#2a78d6" font-weight="700">Sᵀ</text>
    <text x="944" y="184" text-anchor="middle" font-size="16" fill="#52514e" font-family="-apple-system, sans-serif">rows become columns</text>

    <text x="1040" y="272" text-anchor="middle" font-size="26" fill="#52514e" font-family="-apple-system, sans-serif">=</text>

    <!-- score table n x m -->
    <g>
      <rect x="1064" y="222" width="104" height="84" rx="8" fill="none" stroke="#eda100" stroke-width="2"/>
      <g fill="#fdf3dd">
        <rect x="1070" y="228" width="14" height="14" rx="3"/><rect x="1088" y="228" width="14" height="14" rx="3"/><rect x="1106" y="228" width="14" height="14" rx="3"/><rect x="1124" y="228" width="14" height="14" rx="3"/><rect x="1142" y="228" width="14" height="14" rx="3"/>
        <rect x="1070" y="246" width="14" height="14" rx="3"/><rect x="1088" y="246" width="14" height="14" rx="3"/><rect x="1106" y="246" width="14" height="14" rx="3"/><rect x="1124" y="246" width="14" height="14" rx="3"/><rect x="1142" y="246" width="14" height="14" rx="3"/>
        <rect x="1070" y="264" width="14" height="14" rx="3"/><rect x="1088" y="264" width="14" height="14" rx="3"/><rect x="1106" y="264" width="14" height="14" rx="3" fill="#eda100"/><rect x="1124" y="264" width="14" height="14" rx="3"/><rect x="1142" y="264" width="14" height="14" rx="3"/>
        <rect x="1070" y="282" width="14" height="14" rx="3"/><rect x="1088" y="282" width="14" height="14" rx="3"/><rect x="1106" y="282" width="14" height="14" rx="3"/><rect x="1124" y="282" width="14" height="14" rx="3"/><rect x="1142" y="282" width="14" height="14" rx="3"/>
      </g>
    </g>
    <text x="1116" y="336" text-anchor="middle" font-size="19" fill="#0b0b0b" font-family="-apple-system, sans-serif">n × m scores</text>
  </g>

  <text x="934" y="430" text-anchor="middle" font-size="19" fill="#52514e">one matrix product = the whole score table;</text>
  <text x="934" y="456" text-anchor="middle" font-size="19" fill="#52514e">the highlighted cell is score(h₃, s₃) = h₃ᵀs₃</text>
  <text x="934" y="500" text-anchor="middle" font-size="19" fill="#52514e">in the Transformer this construction returns as <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0b0b0b">QKᵀ</tspan></text>

  <!-- footer note -->
  <text x="600" y="600" text-anchor="middle" font-size="19" fill="#52514e">"Stacking" is free — the vectors already lie in memory side by side; a matrix is just how we choose to read them.</text>
</svg>
