<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8983"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" rx="16" fill="#fcfcfb"/>

  <text x="60" y="70" font-size="25" fill="#0b0b0b" font-weight="600">Each vector gets three roles, via three learnable projections</text>

  <!-- ===== Query row ===== -->
  <g>
    <rect x="60" y="120" width="86" height="56" rx="10" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="103" y="156" text-anchor="middle" font-size="23" fill="#0b0b0b" font-family="ui-monospace, Menlo, monospace">W<tspan dy="5" font-size="17">Q</tspan></text>
    <text x="172" y="156" text-anchor="middle" font-size="26" fill="#52514e">×</text>
    <rect x="196" y="118" width="34" height="60" rx="9" fill="#f1f0ee" stroke="#52514e" stroke-width="1.8"/>
    <circle cx="213" cy="134" r="4.5" fill="#52514e"/><circle cx="213" cy="148" r="4.5" fill="#52514e"/><circle cx="213" cy="162" r="4.5" fill="#52514e"/>
    <text x="256" y="156" text-anchor="middle" font-size="26" fill="#52514e">=</text>
    <rect x="282" y="118" width="34" height="60" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <circle cx="299" cy="134" r="4.5" fill="#2a78d6"/><circle cx="299" cy="148" r="4.5" fill="#2a78d6"/><circle cx="299" cy="162" r="4.5" fill="#2a78d6"/>
    <text x="344" y="140" font-size="23" fill="#2a78d6" font-weight="700">Query</text>
    <text x="436" y="140" font-size="21" fill="#0b0b0b">— what I am looking for</text>
    <text x="344" y="172" font-size="19" fill="#52514e" font-style="italic">"Hey, do you have this information?"</text>
  </g>

  <!-- ===== Key row ===== -->
  <g>
    <rect x="60" y="230" width="86" height="56" rx="10" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <text x="103" y="266" text-anchor="middle" font-size="23" fill="#0b0b0b" font-family="ui-monospace, Menlo, monospace">W<tspan dy="5" font-size="17">K</tspan></text>
    <text x="172" y="266" text-anchor="middle" font-size="26" fill="#52514e">×</text>
    <rect x="196" y="228" width="34" height="60" rx="9" fill="#f1f0ee" stroke="#52514e" stroke-width="1.8"/>
    <circle cx="213" cy="244" r="4.5" fill="#52514e"/><circle cx="213" cy="258" r="4.5" fill="#52514e"/><circle cx="213" cy="272" r="4.5" fill="#52514e"/>
    <text x="256" y="266" text-anchor="middle" font-size="26" fill="#52514e">=</text>
    <rect x="282" y="228" width="34" height="60" rx="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="299" cy="244" r="4.5" fill="#eda100"/><circle cx="299" cy="258" r="4.5" fill="#eda100"/><circle cx="299" cy="272" r="4.5" fill="#eda100"/>
    <text x="344" y="250" font-size="23" fill="#c98500" font-weight="700">Key</text>
    <text x="404" y="250" font-size="21" fill="#0b0b0b">— by what feature I can be found</text>
    <text x="344" y="282" font-size="19" fill="#52514e" font-style="italic">"Hi, I have it — give me a large weight!"</text>
  </g>

  <!-- ===== Value row ===== -->
  <g>
    <rect x="60" y="340" width="86" height="56" rx="10" fill="#fdefe9" stroke="#eb6834" stroke-width="2"/>
    <text x="103" y="376" text-anchor="middle" font-size="23" fill="#0b0b0b" font-family="ui-monospace, Menlo, monospace">W<tspan dy="5" font-size="17">V</tspan></text>
    <text x="172" y="376" text-anchor="middle" font-size="26" fill="#52514e">×</text>
    <rect x="196" y="338" width="34" height="60" rx="9" fill="#f1f0ee" stroke="#52514e" stroke-width="1.8"/>
    <circle cx="213" cy="354" r="4.5" fill="#52514e"/><circle cx="213" cy="368" r="4.5" fill="#52514e"/><circle cx="213" cy="382" r="4.5" fill="#52514e"/>
    <text x="256" y="376" text-anchor="middle" font-size="26" fill="#52514e">=</text>
    <rect x="282" y="338" width="34" height="60" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="2"/>
    <circle cx="299" cy="354" r="4.5" fill="#eb6834"/><circle cx="299" cy="368" r="4.5" fill="#eb6834"/><circle cx="299" cy="382" r="4.5" fill="#eb6834"/>
    <text x="344" y="360" font-size="23" fill="#eb6834" font-weight="700">Value</text>
    <text x="428" y="360" font-size="21" fill="#0b0b0b">— what I hand over if chosen</text>
    <text x="344" y="392" font-size="19" fill="#52514e" font-style="italic">"Here's the information I have!"</text>
  </g>

  <!-- library analogy -->
  <text x="60" y="480" font-size="21" fill="#52514e">The library analogy: a query is compared against the catalog</text>
  <text x="60" y="507" font-size="21" fill="#52514e">cards (<tspan fill="#c98500" font-weight="600">keys</tspan>), and what you take home is a mixture of</text>
  <text x="60" y="534" font-size="21" fill="#52514e">books (<tspan fill="#eb6834" font-weight="600">values</tspan>) — the card and the book are different objects.</text>

  <text x="60" y="600" font-size="21" fill="#52514e">One token's step, on the right: <tspan fill="#0b0b0b" font-family="ui-monospace, Menlo, monospace">cat</tspan> asks with its <tspan fill="#2a78d6" font-weight="600">query</tspan>,</text>
  <text x="60" y="627" font-size="21" fill="#52514e">every token answers with its <tspan fill="#c98500" font-weight="600">key</tspan>, the weights mix the <tspan fill="#eb6834" font-weight="600">values</tspan>.</text>

  <!-- ===== right: one attention step ===== -->
  <rect x="770" y="110" width="380" height="520" rx="14" fill="#f7f6f4" stroke="#c9c8c2" stroke-width="1.5"/>
  <text x="960" y="148" text-anchor="middle" font-size="22" font-weight="600" fill="#0b0b0b">self-attention, one position</text>

  <!-- output -->
  <rect x="938" y="170" width="34" height="60" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="2.2"/>
  <circle cx="955" cy="186" r="4.5" fill="#eb6834"/><circle cx="955" cy="200" r="4.5" fill="#eb6834"/><circle cx="955" cy="214" r="4.5" fill="#eb6834"/>
  <text x="985" y="196" font-size="18" fill="#52514e">weighted sum</text>
  <text x="985" y="218" font-size="18" fill="#52514e">of values</text>

  <!-- weights bars -->
  <g fill="#eda100">
    <rect x="822" y="286" width="22" height="14" rx="3"/>
    <rect x="886" y="272" width="22" height="28" rx="3"/>
    <rect x="950" y="252" width="22" height="48" rx="3"/>
    <rect x="1014" y="288" width="22" height="12" rx="3"/>
    <rect x="1078" y="282" width="22" height="18" rx="3"/>
  </g>
  <line x1="810" y1="300" x2="1112" y2="300" stroke="#c9c8c2" stroke-width="1.5"/>
  <g stroke="#eda100" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="833" y1="284" x2="948" y2="232"/>
    <line x1="897" y1="270" x2="950" y2="234"/>
    <line x1="961" y1="250" x2="957" y2="236"/>
    <line x1="1025" y1="286" x2="964" y2="234"/>
    <line x1="1089" y1="280" x2="968" y2="232"/>
  </g>

  <!-- softmax -->
  <rect x="810" y="330" width="302" height="40" rx="9" fill="none" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="961" y="357" text-anchor="middle" font-size="19" fill="#52514e" font-family="ui-monospace, Menlo, monospace">softmax</text>

  <!-- score dots + q·k lines -->
  <g>
    <circle cx="833" cy="400" r="8" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="897" cy="400" r="8" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="961" cy="400" r="8" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="1025" cy="400" r="8" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="1089" cy="400" r="8" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  </g>
  <line x1="833" y1="390" x2="833" y2="374" stroke="#8a8983" stroke-width="1.5"/>
  <line x1="897" y1="390" x2="897" y2="374" stroke="#8a8983" stroke-width="1.5"/>
  <line x1="961" y1="390" x2="961" y2="374" stroke="#8a8983" stroke-width="1.5"/>
  <line x1="1025" y1="390" x2="1025" y2="374" stroke="#8a8983" stroke-width="1.5"/>
  <line x1="1089" y1="390" x2="1089" y2="374" stroke="#8a8983" stroke-width="1.5"/>

  <!-- k/v pairs per token + q under the query token -->
  <g>
    <!-- token 1 -->
    <rect x="812" y="440" width="18" height="44" rx="6" fill="#fdf3dd" stroke="#eda100" stroke-width="1.6"/>
    <rect x="836" y="440" width="18" height="44" rx="6" fill="#fdefe9" stroke="#eb6834" stroke-width="1.6"/>
    <!-- token 2 -->
    <rect x="876" y="440" width="18" height="44" rx="6" fill="#fdf3dd" stroke="#eda100" stroke-width="1.6"/>
    <rect x="900" y="440" width="18" height="44" rx="6" fill="#fdefe9" stroke="#eb6834" stroke-width="1.6"/>
    <!-- token 3 = query token: q vector -->
    <rect x="944" y="440" width="18" height="44" rx="6" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2.2"/>
    <rect x="968" y="440" width="18" height="44" rx="6" fill="#fdf3dd" stroke="#eda100" stroke-width="1.6"/>
    <!-- token 4 -->
    <rect x="1004" y="440" width="18" height="44" rx="6" fill="#fdf3dd" stroke="#eda100" stroke-width="1.6"/>
    <rect x="1028" y="440" width="18" height="44" rx="6" fill="#fdefe9" stroke="#eb6834" stroke-width="1.6"/>
    <!-- token 5 -->
    <rect x="1068" y="440" width="18" height="44" rx="6" fill="#fdf3dd" stroke="#eda100" stroke-width="1.6"/>
    <rect x="1092" y="440" width="18" height="44" rx="6" fill="#fdefe9" stroke="#eb6834" stroke-width="1.6"/>
  </g>
  <!-- q asks all keys -->
  <g stroke="#2a78d6" stroke-width="1.5">
    <line x1="948" y1="436" x2="837" y2="410"/>
    <line x1="951" y1="436" x2="900" y2="410"/>
    <line x1="955" y1="436" x2="959" y2="410"/>
    <line x1="959" y1="436" x2="1022" y2="410"/>
    <line x1="962" y1="436" x2="1085" y2="410"/>
  </g>
  <text x="953" y="510" text-anchor="middle" font-size="17" fill="#2a78d6" font-family="ui-monospace, Menlo, monospace">q</text>
  <text x="836" y="510" text-anchor="middle" font-size="17" fill="#c98500" font-family="ui-monospace, Menlo, monospace">k v</text>

  <!-- tokens -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle" fill="#0b0b0b">
    <text x="833" y="560">I</text>
    <text x="897" y="560">saw</text>
    <text x="961" y="560" font-weight="700">cat</text>
    <text x="1025" y="560">on</text>
    <text x="1089" y="560">mat</text>
  </g>
  <text x="961" y="602" text-anchor="middle" font-size="18" fill="#52514e">every token carries its own q, k, v</text>
</svg>
