<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 1200 830" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8983"/>
    </marker>
  </defs>
  <rect x="0" y="100" width="1200" height="830" rx="16" fill="#fcfcfb"/>

  <!-- ================== ENCODER TOWER ================== -->
  <!-- container -->
  <rect x="268" y="494" width="244" height="246" rx="14" fill="#f4f8fd" stroke="#2a78d6" stroke-width="2"/>
  <text x="282" y="764" font-size="21" fill="#2a78d6" font-weight="700">N×</text>

  <!-- blocks (bottom -> top) -->
  <rect x="290" y="682" width="200" height="44" rx="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  <text x="390" y="710" text-anchor="middle" font-size="19" fill="#0b0b0b">Multi-Head Attention</text>

  <rect x="290" y="624" width="200" height="44" rx="9" fill="#f1f0ee" stroke="#8a8983" stroke-width="1.6"/>
  <text x="390" y="652" text-anchor="middle" font-size="19" fill="#52514e">Add &amp; Norm</text>

  <rect x="290" y="566" width="200" height="44" rx="9" fill="#edebf7" stroke="#4a3aa7" stroke-width="2"/>
  <text x="390" y="594" text-anchor="middle" font-size="19" fill="#0b0b0b">Feed-Forward</text>

  <rect x="290" y="508" width="200" height="44" rx="9" fill="#f1f0ee" stroke="#8a8983" stroke-width="1.6"/>
  <text x="390" y="536" text-anchor="middle" font-size="19" fill="#52514e">Add &amp; Norm</text>

  <!-- embedding -->
  <rect x="290" y="770" width="200" height="48" rx="9" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="390" y="791" text-anchor="middle" font-size="18" fill="#0b0b0b">Input Embedding</text>
  <text x="390" y="811" text-anchor="middle" font-size="17" fill="#52514e">+ Positional Encoding</text>

  <!-- spine -->
  <line x1="390" y1="768" x2="390" y2="746" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="390" y1="682" x2="390" y2="668" stroke="#8a8983" stroke-width="1.8"/>
  <line x1="390" y1="624" x2="390" y2="610" stroke="#8a8983" stroke-width="1.8"/>
  <line x1="390" y1="566" x2="390" y2="552" stroke="#8a8983" stroke-width="1.8"/>

  <!-- inputs -->
  <text x="390" y="856" text-anchor="middle" font-size="20" fill="#2a78d6" font-weight="600">source tokens</text>
  <line x1="390" y1="836" x2="390" y2="822" stroke="#8a8983" stroke-width="2"/>

  <!-- encoder -> decoder cross attention -->
  <path d="M 390 494 L 390 452 L 560 452 L 560 588 L 630 588" fill="none" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="470" y="432" text-anchor="middle" font-size="18" fill="#2a78d6">encoder output: k, v</text>

  <!-- ================== DECODER TOWER ================== -->
  <!-- container -->
  <rect x="628" y="378" width="244" height="362" rx="14" fill="#fef6f1" stroke="#eb6834" stroke-width="2"/>
  <text x="836" y="764" font-size="21" fill="#eb6834" font-weight="700">×N</text>

  <!-- blocks (bottom -> top) -->
  <rect x="650" y="682" width="200" height="44" rx="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  <text x="750" y="704" text-anchor="middle" font-size="18" fill="#0b0b0b">Masked Multi-Head</text>
  <text x="750" y="722" text-anchor="middle" font-size="18" fill="#0b0b0b">Attention</text>

  <rect x="650" y="624" width="200" height="44" rx="9" fill="#f1f0ee" stroke="#8a8983" stroke-width="1.6"/>
  <text x="750" y="652" text-anchor="middle" font-size="19" fill="#52514e">Add &amp; Norm</text>

  <rect x="650" y="566" width="200" height="44" rx="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  <text x="750" y="588" text-anchor="middle" font-size="18" fill="#0b0b0b">Multi-Head Attention</text>
  <text x="750" y="606" text-anchor="middle" font-size="17" fill="#52514e">(cross-attention)</text>

  <rect x="650" y="508" width="200" height="44" rx="9" fill="#f1f0ee" stroke="#8a8983" stroke-width="1.6"/>
  <text x="750" y="536" text-anchor="middle" font-size="19" fill="#52514e">Add &amp; Norm</text>

  <rect x="650" y="450" width="200" height="44" rx="9" fill="#edebf7" stroke="#4a3aa7" stroke-width="2"/>
  <text x="750" y="478" text-anchor="middle" font-size="19" fill="#0b0b0b">Feed-Forward</text>

  <rect x="650" y="392" width="200" height="44" rx="9" fill="#f1f0ee" stroke="#8a8983" stroke-width="1.6"/>
  <text x="750" y="420" text-anchor="middle" font-size="19" fill="#52514e">Add &amp; Norm</text>

  <!-- embedding -->
  <rect x="650" y="770" width="200" height="48" rx="9" fill="#fdefe9" stroke="#eb6834" stroke-width="2"/>
  <text x="750" y="791" text-anchor="middle" font-size="18" fill="#0b0b0b">Output Embedding</text>
  <text x="750" y="811" text-anchor="middle" font-size="17" fill="#52514e">+ Positional Encoding</text>

  <!-- spine -->
  <line x1="750" y1="768" x2="750" y2="746" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="682" x2="750" y2="668" stroke="#8a8983" stroke-width="1.8"/>
  <line x1="750" y1="624" x2="750" y2="610" stroke="#8a8983" stroke-width="1.8"/>
  <line x1="750" y1="566" x2="750" y2="552" stroke="#8a8983" stroke-width="1.8"/>
  <line x1="750" y1="508" x2="750" y2="494" stroke="#8a8983" stroke-width="1.8"/>
  <line x1="750" y1="450" x2="750" y2="436" stroke="#8a8983" stroke-width="1.8"/>

  <!-- inputs -->
  <text x="750" y="856" text-anchor="middle" font-size="20" fill="#eb6834" font-weight="600">target tokens so far (shifted right)</text>
  <line x1="750" y1="836" x2="750" y2="822" stroke="#8a8983" stroke-width="2"/>

  <!-- head: linear + softmax + output -->
  <line x1="750" y1="378" x2="750" y2="352" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="650" y="296" width="200" height="44" rx="9" fill="#edebf7" stroke="#4a3aa7" stroke-width="2"/>
  <text x="750" y="324" text-anchor="middle" font-size="19" fill="#0b0b0b">Linear  d → |V|</text>
  <line x1="750" y1="296" x2="750" y2="270" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="650" y="214" width="200" height="44" rx="9" fill="#f1f0ee" stroke="#8a8983" stroke-width="1.6"/>
  <text x="750" y="242" text-anchor="middle" font-size="19" fill="#52514e" font-family="ui-monospace, Menlo, monospace">softmax</text>
  <line x1="750" y1="214" x2="750" y2="188" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <text x="750" y="162" text-anchor="middle" font-size="20" fill="#0b0b0b" font-weight="600">probabilities of the next token</text>

  <!-- ================== ANNOTATIONS ================== -->
  <!-- encoder self-attention -->
  <text x="40" y="666" font-size="19" fill="#0b0b0b" font-weight="600">Encoder self-attention:</text>
  <text x="40" y="690" font-size="18" fill="#52514e">tokens look at each other</text>
  <text x="40" y="712" font-size="18" fill="#52514e">q, k, v — from</text>
  <text x="40" y="734" font-size="18" fill="#52514e">the encoder states</text>
  <line x1="262" y1="700" x2="286" y2="702" stroke="#c9c8c2" stroke-width="1.5"/>

  <!-- FFN -->
  <text x="40" y="574" font-size="19" fill="#0b0b0b" font-weight="600">Feed-forward:</text>
  <text x="40" y="598" font-size="18" fill="#52514e">each token digests what</text>
  <text x="40" y="620" font-size="18" fill="#52514e">attention has gathered</text>
  <line x1="252" y1="592" x2="286" y2="588" stroke="#c9c8c2" stroke-width="1.5"/>

  <!-- masked self-attention -->
  <text x="890" y="688" font-size="19" fill="#0b0b0b" font-weight="600">Masked self-attention:</text>
  <text x="890" y="712" font-size="18" fill="#52514e">tokens look only at the</text>
  <text x="890" y="734" font-size="18" fill="#52514e">previous tokens</text>
  <line x1="884" y1="706" x2="854" y2="704" stroke="#c9c8c2" stroke-width="1.5"/>

  <!-- cross-attention -->
  <text x="890" y="574" font-size="19" fill="#0b0b0b" font-weight="600">Cross-attention:</text>
  <text x="890" y="598" font-size="18" fill="#52514e">the target queries the source;</text>
  <text x="890" y="620" font-size="18" fill="#52514e">q — from decoder,</text>
  <text x="890" y="642" font-size="18" fill="#52514e">k, v — from encoder</text>
  <line x1="884" y1="592" x2="854" y2="588" stroke="#c9c8c2" stroke-width="1.5"/>

  <!-- output head -->
  <text x="890" y="266" font-size="18" fill="#52514e">the language-model head:</text>
  <text x="890" y="288" font-size="18" fill="#52514e">same cross-entropy as in Part 0</text>
  <line x1="884" y1="272" x2="854" y2="266" stroke="#c9c8c2" stroke-width="1.5"/>

  <!-- add & norm note -->
  <text x="570" y="890" text-anchor="middle" font-size="19" fill="#52514e">Residual connection + LayerNorm (<tspan font-weight="600" fill="#0b0b0b">Add &amp; Norm</tspan>) wrap every block</text>
</svg>
