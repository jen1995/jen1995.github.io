<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8983"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#eda100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="720" rx="16" fill="#fcfcfb"/>

  <!-- ================= left inset: the attention function ================= -->
  <rect x="50" y="70" width="390" height="330" rx="14" fill="#f7f6f4" stroke="#c9c8c2" stroke-width="1.5"/>
  <text x="245" y="112" text-anchor="middle" font-size="23" font-weight="600" fill="#0b0b0b">Attention function</text>

  <!-- inputs -->
  <rect x="110" y="290" width="44" height="76" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="132" cy="311" r="5.5" fill="#2a78d6"/><circle cx="132" cy="328" r="5.5" fill="#2a78d6"/><circle cx="132" cy="345" r="5.5" fill="#2a78d6"/>
  <text x="132" y="393" text-anchor="middle" font-size="19" fill="#2a78d6" font-family="ui-monospace, Menlo, monospace">sₖ</text>

  <rect x="276" y="290" width="44" height="76" rx="12" fill="#fdefe9" stroke="#eb6834" stroke-width="2"/>
  <circle cx="298" cy="311" r="5.5" fill="#eb6834"/><circle cx="298" cy="328" r="5.5" fill="#eb6834"/><circle cx="298" cy="345" r="5.5" fill="#eb6834"/>
  <text x="298" y="393" text-anchor="middle" font-size="19" fill="#eb6834" font-family="ui-monospace, Menlo, monospace">hₜ</text>

  <!-- function box -->
  <rect x="145" y="190" width="140" height="56" rx="12" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  <text x="215" y="226" text-anchor="middle" font-size="21" fill="#0b0b0b" font-family="ui-monospace, Menlo, monospace">score(·,·)</text>

  <line x1="140" y1="285" x2="185" y2="252" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="292" y1="285" x2="248" y2="252" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>

  <!-- output -->
  <line x1="215" y1="184" x2="215" y2="152" stroke="#8a8983" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="215" cy="138" r="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  <text x="240" y="133" font-size="19" fill="#52514e">scalar: relevance</text>
  <text x="240" y="156" font-size="19" fill="#52514e">of token k to step t</text>

  <!-- ================= right: the full mechanism ================= -->
  <!-- encoder states -->
  <g>
    <rect x="470" y="470" width="44" height="76" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <rect x="560" y="470" width="44" height="76" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <rect x="650" y="470" width="44" height="76" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <rect x="740" y="470" width="44" height="76" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <rect x="830" y="470" width="44" height="76" rx="12" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#2a78d6" text-anchor="middle">
    <text x="492" y="575">s₁</text><text x="582" y="575">s₂</text><text x="672" y="575">s₃</text><text x="762" y="575">s₄</text><text x="852" y="575">s₅</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#0b0b0b" text-anchor="middle">
    <text x="492" y="620">Я</text><text x="582" y="620">видел</text><text x="672" y="620">кота</text><text x="762" y="620">на</text><text x="852" y="620">мате</text>
  </g>
  <text x="672" y="668" text-anchor="middle" font-size="21" fill="#2a78d6" font-weight="600">encoder states</text>

  <!-- decoder state -->
  <rect x="1010" y="470" width="44" height="76" rx="12" fill="#fdefe9" stroke="#eb6834" stroke-width="2"/>
  <text x="1032" y="575" text-anchor="middle" font-size="19" fill="#eb6834" font-family="ui-monospace, Menlo, monospace">hₜ</text>
  <text x="1032" y="620" text-anchor="middle" font-size="19" fill="#0b0b0b" font-family="ui-monospace, Menlo, monospace">cat</text>
  <text x="1032" y="668" text-anchor="middle" font-size="21" fill="#eb6834" font-weight="600">decoder, step t</text>

  <!-- score circles -->
  <g>
    <circle cx="492" cy="420" r="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="582" cy="420" r="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="672" cy="420" r="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="762" cy="420" r="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
    <circle cx="852" cy="420" r="9" fill="#fdf3dd" stroke="#eda100" stroke-width="2"/>
  </g>
  <line x1="492" y1="462" x2="492" y2="438" stroke="#8a8983" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="582" y1="462" x2="582" y2="438" stroke="#8a8983" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="672" y1="462" x2="672" y2="438" stroke="#8a8983" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="762" y1="462" x2="762" y2="438" stroke="#8a8983" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="852" y1="462" x2="852" y2="438" stroke="#8a8983" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- decoder state feeds every score -->
  <g stroke="#eb6834" stroke-width="1.6" opacity="0.85">
    <line x1="1012" y1="484" x2="503" y2="425"/>
    <line x1="1012" y1="484" x2="593" y2="426"/>
    <line x1="1012" y1="484" x2="683" y2="427"/>
    <line x1="1012" y1="484" x2="772" y2="428"/>
    <line x1="1012" y1="484" x2="861" y2="430"/>
  </g>
  <text x="960" y="430" font-size="19" fill="#eb6834">hₜ asks every sₖ</text>

  <!-- softmax box -->
  <rect x="462" y="330" width="420" height="46" rx="10" fill="none" stroke="#8a8983" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="672" y="360" text-anchor="middle" font-size="20" fill="#52514e" font-family="ui-monospace, Menlo, monospace">softmax</text>
  <line x1="492" y1="410" x2="492" y2="382" stroke="#8a8983" stroke-width="1.6"/>
  <line x1="582" y1="410" x2="582" y2="382" stroke="#8a8983" stroke-width="1.6"/>
  <line x1="672" y1="410" x2="672" y2="382" stroke="#8a8983" stroke-width="1.6"/>
  <line x1="762" y1="410" x2="762" y2="382" stroke="#8a8983" stroke-width="1.6"/>
  <line x1="852" y1="410" x2="852" y2="382" stroke="#8a8983" stroke-width="1.6"/>

  <!-- weights bars -->
  <g fill="#eda100">
    <rect x="478" y="288" width="28" height="16" rx="3"/>
    <rect x="568" y="272" width="28" height="32" rx="3"/>
    <rect x="658" y="240" width="28" height="64" rx="3"/>
    <rect x="748" y="292" width="28" height="12" rx="3"/>
    <rect x="838" y="284" width="28" height="20" rx="3"/>
  </g>
  <line x1="462" y1="304" x2="882" y2="304" stroke="#c9c8c2" stroke-width="1.5"/>
  <text x="920" y="280" font-size="19" fill="#52514e">weights: a distribution</text>
  <text x="920" y="304" font-size="19" fill="#52514e">over source tokens</text>

  <!-- weighted sum -->
  <g stroke="#eda100" stroke-width="1.6" stroke-dasharray="4 3">
    <line x1="492" y1="286" x2="660" y2="172"/>
    <line x1="582" y1="270" x2="664" y2="170"/>
    <line x1="672" y1="238" x2="672" y2="168"/>
    <line x1="762" y1="290" x2="684" y2="172"/>
    <line x1="852" y1="282" x2="688" y2="174"/>
  </g>
  <rect x="650" y="88" width="44" height="76" rx="12" fill="#fdf3dd" stroke="#eda100" stroke-width="2.5"/>
  <circle cx="672" cy="109" r="5.5" fill="#eda100"/><circle cx="672" cy="126" r="5.5" fill="#eda100"/><circle cx="672" cy="143" r="5.5" fill="#eda100"/>
  <text x="730" y="112" font-size="21" fill="#0b0b0b" font-weight="600">attention output:</text>
  <text x="730" y="138" font-size="19" fill="#52514e">weighted sum of encoder states —</text>
  <text x="730" y="162" font-size="19" fill="#52514e">a context tailored to step t, passed to the decoder</text>
</svg>
